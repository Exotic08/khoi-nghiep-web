<svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 38 38" fill="none">
  <defs>
    <!-- Filter viền vàng hoàng kim + bóng đổ sang trọng -->
    <filter id="hand-glow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#E5B842" flood-opacity="0.85"/>
    </filter>

    <!-- Quả nho đen ánh tím thẫm -->
    <radialGradient id="ptr-berry-grad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6B2961"/>
      <stop offset="35%" stop-color="#3B1539"/>
      <stop offset="75%" stop-color="#1E0A1D"/>
      <stop offset="100%" stop-color="#0A020A"/>
    </radialGradient>

    <!-- Gradient bàn tay thanh lịch (Ivory Cream to Warm Pearl) -->
    <linearGradient id="hand-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="60%" stop-color="#F7EEDF"/>
      <stop offset="100%" stop-color="#EADBBE"/>
    </linearGradient>

    <linearGradient id="hand-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3CA58"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#7A580A"/>
    </linearGradient>

    <linearGradient id="ptr-leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9DE082"/>
      <stop offset="60%" stop-color="#4F8B3E"/>
      <stop offset="100%" stop-color="#24481C"/>
    </linearGradient>
  </defs>

  <g filter="url(#hand-glow)">
    <!-- 1. Bàn tay trỏ nghệ thuật (Pointing Hand) - Hotspot tại (3.5, 2.5) -->
    <!-- Ngón trỏ vươn cao về góc trên bên trái -->
    <path d="
      M3.5 2.5
      C4.5 1.5 6.5 1.8 7.5 3
      L12 9
      C12.8 10 13.5 10.5 14.8 10
      C16 9.5 17.5 10.2 17.8 11.5
      C18 12.2 19 12.5 19.5 13.5
      C19.8 14.2 20.2 15 20 16
      C19.5 18 18 19.5 16 21
      L13.5 22.5
      C11.5 24 9.5 23 8 21.5
      L4.5 17
      C3 15 2.2 13 2.5 11
      L4.5 5
      C4.8 3.8 3 3 3.5 2.5 Z"
      fill="url(#hand-fill)"
      stroke="url(#hand-stroke)"
      stroke-width="1.2"
      stroke-linejoin="round"/>

    <!-- Ngấn khớp ngón tay tinh tế -->
    <path d="M5.5 6 C6.8 6.5 8 7 9 7.8" stroke="#D1AB57" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M7.5 10 C9 10.5 10.5 11.2 11.8 12" stroke="#D1AB57" stroke-width="0.8" stroke-linecap="round" fill="none"/>

    <!-- Ngôi sao lấp lánh tại đầu ngón trỏ báo hiệu clickable (Sparkle) -->
    <path d="M3.5 0 L4.2 2 L6.2 2.7 L4.2 3.4 L3.5 5.4 L2.8 3.4 L0.8 2.7 L2.8 2 Z" fill="#FFE885" opacity="0.95"/>
    <circle cx="3.5" cy="2.7" r="0.8" fill="#FFFFFF"/>

    <!-- 2. Chùm nho đen nằm gọn trong lòng bàn tay / trên tay -->
    <!-- Cuống & Lá nho gắn trên chùm nho -->
    <path d="M16 11 C18 9 21 8.5 24 10 C24.5 11.5 23 13 23.5 14 C22 14.5 20.5 13.5 19 14.2 Z"
          fill="url(#ptr-leaf-grad)" stroke="#1B3E16" stroke-width="0.5"/>
    <path d="M14 12 C15.5 10.5 17 11 18 12" stroke="#5C3B1E" stroke-width="1.2" stroke-linecap="round" fill="none"/>

    <!-- Các quả nho đen mọng nước trong chùm -->
    <!-- Hàng trên -->
    <circle cx="17.5" cy="15" r="3.6" fill="url(#ptr-berry-grad)"/>
    <ellipse cx="16.5" cy="14" rx="1.4" ry="0.8" fill="#B95AA9" opacity="0.8" transform="rotate(-25 16.5 14)"/>
    <circle cx="16" cy="13.6" r="0.5" fill="#FFFFFF" opacity="0.9"/>

    <circle cx="23.5" cy="15.5" r="3.4" fill="url(#ptr-berry-grad)"/>
    <ellipse cx="22.5" cy="14.5" rx="1.3" ry="0.7" fill="#B95AA9" opacity="0.8" transform="rotate(-25 22.5 14.5)"/>
    <circle cx="22" cy="14.2" r="0.4" fill="#FFFFFF" opacity="0.9"/>

    <!-- Hàng giữa -->
    <circle cx="15" cy="20.5" r="3.6" fill="url(#ptr-berry-grad)"/>
    <ellipse cx="14" cy="19.5" rx="1.4" ry="0.8" fill="#B95AA9" opacity="0.8" transform="rotate(-25 14 19.5)"/>
    <circle cx="13.5" cy="19.2" r="0.5" fill="#FFFFFF" opacity="0.9"/>

    <circle cx="21" cy="21" r="3.8" fill="url(#ptr-berry-grad)"/>
    <ellipse cx="20" cy="19.8" rx="1.5" ry="0.9" fill="#B95AA9" opacity="0.8" transform="rotate(-25 20 19.8)"/>
    <circle cx="19.4" cy="19.4" r="0.5" fill="#FFFFFF" opacity="0.9"/>

    <circle cx="27" cy="21.5" r="3" fill="url(#ptr-berry-grad)"/>
    <ellipse cx="26.2" cy="20.7" rx="1" ry="0.6" fill="#B95AA9" opacity="0.75" transform="rotate(-25 26.2 20.7)"/>

    <!-- Hàng dưới -->
    <circle cx="18.5" cy="26" r="3.4" fill="url(#ptr-berry-grad)"/>
    <ellipse cx="17.6" cy="25" rx="1.3" ry="0.8" fill="#B95AA9" opacity="0.8" transform="rotate(-25 17.6 25)"/>
    <circle cx="17.2" cy="24.7" r="0.4" fill="#FFFFFF" opacity="0.9"/>

    <circle cx="24" cy="26.5" r="3.2" fill="url(#ptr-berry-grad)"/>
    <ellipse cx="23.2" cy="25.7" rx="1.2" ry="0.7" fill="#B95AA9" opacity="0.8" transform="rotate(-25 23.2 25.7)"/>

    <!-- Quả đáy chóp chùm -->
    <circle cx="21" cy="31" r="2.6" fill="url(#ptr-berry-grad)"/>
    <ellipse cx="20.3" cy="30.3" rx="0.9" ry="0.5" fill="#B95AA9" opacity="0.75" transform="rotate(-25 20.3 30.3)"/>
    <circle cx="20" cy="30" r="0.3" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
